# FinanceKit continuous integration and tag-based release workflow.
#
# Quality gates:
#   1. Ruff lint and formatting must pass.
#   2. The pytest suite must pass on every matrix combination. `fail-fast: false`
#      reports all combinations instead of hiding later failures.
#   3. Branch coverage must remain at or above 95%.
#   4. Source/wheel distributions must build and pass `twine check`.
#
# A non-zero exit from any required step marks the job and workflow failed.
# Test/coverage artifacts are uploaded even after a test failure (`if: always()`).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly regression run every Monday at 03:17 UTC.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Ruff and workflow validator dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.3" "PyYAML==6.0.3"

      - name: Validate workflow semantics
        run: python scripts/validate_workflow.py

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --editable .

      - name: Byte-compile Python sources
        run: python -m compileall -q financekit tests examples scripts tools

      - name: Run test suite with JUnit report
        run: >-
          python -m pytest -vv
          --junitxml=test-results/junit-${{ matrix.os }}-${{ matrix.python-version }}.xml

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Coverage quality gate
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install coverage dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --editable .

      - name: Run tests and enforce at least 95% branch coverage
        run: >-
          python -m pytest -vv
          --cov=financekit
          --cov-branch
          --cov-fail-under=95
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --junitxml=test-results/junit-coverage.xml

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            test-results/junit-coverage.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build distributions
    needs: [lint, test, coverage]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1" "twine==7.0.0"

      - name: Build source distribution and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Create GitHub Release for this version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --verify-tag
          --generate-notes
          --title "FinanceKit ${{ github.ref_name }}"
